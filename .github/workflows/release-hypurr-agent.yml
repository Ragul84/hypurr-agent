name: Release Hypurr Agent

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag without v (e.g. 0.1.0)"
        required: true
        default: "0.1.0"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - id: ver
        name: Normalize version
        run: |
          V="${{ github.event.inputs.version || github.ref_name }}"
          echo "version=${V#v}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Install
        run: bun install --frozen-lockfile || bun install
      - name: Build release binaries
        working-directory: packages/opencode
        run: |
          bun run build
        env:
          OPENCODE_VERSION: ${{ steps.ver.outputs.version }}
      - name: Package + digests
        working-directory: packages/opencode
        run: |
          set -euo pipefail
          mkdir -p /tmp/release
          cd dist
          for dir in hypurr-agent-*; do
            [ -d "$dir" ] || continue
            # Archive the bin/ contents so the binary sits at the archive root.
            if [[ "$dir" == *darwin* || "$dir" == *windows* ]]; then
              (cd "$dir/bin" && zip -qr "/tmp/release/${dir}.zip" .)
            else
              tar -czf "/tmp/release/${dir}.tar.gz" -C "$dir/bin" .
            fi
          done
          cd /tmp/release
          sha256sum *.tar.gz *.zip 2>/dev/null | tee SHA256SUMS || true
          ls -la
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hypurr-agent-binaries
          path: /tmp/release/*
  smoke-windows:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: hypurr-agent-binaries
          path: release
      - name: Checksum + --version (windows-x64)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $zip = "release/hypurr-agent-windows-x64.zip"
          $want = (Get-Content release/SHA256SUMS | Where-Object { $_ -match "hypurr-agent-windows-x64.zip$" }).Split(" ")[0]
          $got = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($got -ne $want) { throw "checksum mismatch $got != $want" }
          Expand-Archive $zip -DestinationPath agent
          $out = & ./agent/hypurr-agent.exe --version
          if ($LASTEXITCODE -ne 0) { throw "exit $LASTEXITCODE" }
          Write-Output "version: $out"

  release:
    needs: [build, smoke-windows]
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: hypurr-agent-binaries
          path: /tmp/release
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build.outputs.version }}
          name: Hypurr Agent ${{ needs.build.outputs.version }}
          draft: true
          files: /tmp/release/*
          body: |
            Hypurr Agent binaries for Linux, macOS and Windows (x64/arm64). MIT; see NOTICE.

            See SHA256SUMS in the assets. Config/data: `~/.hypurr/agent`.
            Default provider: Hypurr gateway (`HYPURR_GATEWAY_URL`, `HYPURR_API_KEY`).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
